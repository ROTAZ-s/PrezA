a:[["Good morning, everyone. Let me start the ball rolling with a simple question: are you a spectator or a competitor?","Всем доброе утро. Начну с простого вопроса: вы зритель или участник?","comPEtitor · SPECtator"],["Football is the most popular spectator sport in the world, and millions of fans watch it every weekend.","Футбол — самый популярный зрелищный спорт в мире, миллионы фанатов смотрят его каждые выходные.",""],["However, far fewer people actually play. Today I'd like to explain why that's a pity.","Однако играет гораздо меньше людей. Сегодня объясню, почему это жаль.",""],["My plan is easy to remember, because it spells the word SPORT: Self, Physical, Obsession, Rules and the Top.","Мой план легко запомнить: он складывается в слово SPORT.",""],["So, let's begin with S.","Итак, начнём с S.","→ слайд S"],["To sum up, sport gives us self-confidence and a healthy body; however, getting to the top requires sacrifice, determination and fair play.","Итак, спорт даёт уверенность и здоровое тело, но вершина требует жертв, решимости и честной игры.","финал"],["You don't have to win a gold Olympic medal — you only need to start.","Не нужно выигрывать олимпийское золото — нужно только начать.",""],["So, let me go back to my first question: spectator or competitor?","Вернусь к первому вопросу: зритель или участник?",""],["I hope that after these five minutes at least a few of you will choose to compete. Thank you for listening! Are there any questions?","Надеюсь, после этих пяти минут хотя бы несколько из вас выберут соревноваться. Спасибо! Вопросы?",""]],
s:[["S stands for self. Take martial arts, for example.","S — это self, «себя». Возьмём, к примеру, боевые искусства.",""],["People usually take up karate for the purpose of self-defence.","Обычно карате начинают ради самообороны.",""],["However, they soon discover that it gives them much more: self-confidence, self-control and self-discipline.","Но скоро понимают, что оно даёт больше: уверенность, самообладание и самодисциплину.","self-DIScipline"],["What's more, karate has strict etiquette, so good manners and consideration for others are expected at all times.","Более того, в карате строгий этикет: манеры и внимание к другим обязательны всегда.","ETiquette · consideRAtion"],["As a result, students build a real sense of self-respect.","В итоге у учеников появляется настоящее самоуважение.",""],["In other words, sport doesn't only train your body — it has a huge impact on who you are.","Другими словами, спорт тренирует не только тело — он сильно влияет на то, кто ты есть.",""],["Of course, the body matters too. That's P.","Конечно, тело тоже важно. Это P.","→ слайд P"]],
p:[["P is for physical. Regular training improves the body's physical stamina and suppleness.","P — physical. Регулярные тренировки улучшают выносливость и гибкость.","STAmina · SUPPleness"],["Tennis, swimming and karate exercise the entire body, so muscle imbalances don't occur.","Теннис, плавание и карате тренируют всё тело, поэтому мышечного дисбаланса не возникает.","ocCUR"],["On top of that, your strength, coordination, flexibility and agility improve on both sides of the body.","Вдобавок сила, координация, гибкость и ловкость улучшаются с обеих сторон тела.","aGIlity"],["Personally, I think agility is the most underrated quality: it lets an athlete react in a split second — in other words, to be on the ball.","Лично я считаю ловкость самым недооценённым качеством: она даёт реагировать за долю секунды — быть начеку.",""],["But all these benefits come at a price. Which brings me to O.","Но у всех этих плюсов есть цена. Переходим к O.","→ слайд O"]],
o:[["O stands for obsession. To get to the top, professional athletes push themselves to the limit.","O — obsession, одержимость. Чтобы добраться до вершины, профи доводят себя до предела.","obSESSion"],["A professional triathlete once wrote about the sacrifices she had made: very little free time, hardly any social life and far too much pain.","Одна триатлетка написала о своих жертвах: очень мало свободного времени, почти никакой личной жизни и слишком много боли.","SACrifice · TRIathlete"],["Some people would call that being obsessive about sport.","Кто-то назвал бы это одержимостью спортом.",""],["Nevertheless, I believe it's determination — the refusal to let anything stop you.","Тем не менее, я считаю, что это решимость — отказ позволить чему-то тебя остановить.","determiNAtion"],["It requires ongoing commitment, mental toughness and the ability to handle mental intensity.","Это требует постоянной преданности делу, силы воли и умения выдерживать напряжение.","comMITment"],["Few people have it, and that's exactly what sets champions apart from their competitors.","Мало у кого это есть — именно это отличает чемпионов от соперников.",""],["However, determination means nothing if the game isn't fair. R.","Но решимость ничего не стоит, если игра нечестная. R.","→ слайд R"]],
r:[["R is for rules. Every sport needs a level playing field.","R — rules, правила. Каждому спорту нужны равные условия.",""],["That's why we have referees — to make sure players follow the rules.","Поэтому есть судьи — следить, чтобы игроки соблюдали правила.","refeREE"],["Unfortunately, some athletes break them, for example by doping.","К сожалению, некоторые их нарушают, например допингом.",""],["In my view, that's scoring an own goal: you want to win, but you destroy your own career.","По-моему, это гол в свои ворота: хочешь победить, а рушишь свою карьеру.",""],["Another problem is when organisers move the goalposts and change the rules in the middle of a season.","Другая проблема — когда организаторы меняют правила посреди сезона.","GOALpost"],["So fair play isn't just a nice phrase — without it, sport becomes a whole new ball game, and not a good one.","Честная игра — не просто фраза: без неё спорт становится совсем другой историей, и не хорошей.","можно пропустить, если не успеваешь"],["Now, who shows all of this at once? Let's go to the top.","Кто показывает всё это сразу? Поднимаемся на вершину.","→ слайд T"]],
v:[["T is for the top. In my opinion, the greatest modern athlete is the Dutch wheelchair tennis player Esther Vergeer.","T — the top. По-моему, величайшая спортсменка современности — нидерландская теннисистка на коляске Эстер Верхеер.","WHEELchair"],["She was a truly remarkable sportswoman.","Она была по-настоящему выдающейся спортсменкой.",""],["What's extraordinary about her is that she went unbeaten for 470 matches in a row — about ten years without a single defeat!","Поразительно, что она не проиграла 470 матчей подряд — около десяти лет без единого поражения!","four hundred and seventy · unBEATen"],["She won gold at several Paralympic Games and became an ambassador for people with disabilities.","Она выигрывала золото на нескольких Паралимпиадах и стала представителем людей с инвалидностью.","ParaLYMpic · amBASSador"],["Compared to many famous stars, she is far less known; however, she is arguably the greatest athlete of all time.","По сравнению со многими звёздами она гораздо менее известна, но, пожалуй, она величайшая спортсменка всех времён.",""],["There's no doubt she is a very determined person — and that's S, O and R in one person.","Без сомнения, она очень целеустремлённый человек — и в ней сразу S, O и R.",""],["So, what's the conclusion?","Итак, какой вывод?","→ финал"]]

function code(){var rows=[];Object.keys(S.it).forEach(function(id){var s=S.it[id];if(s.seen)rows.push(id+"."+s.b+"."+Math.round(s.last/36e5).toString(36))});var jg=Object.keys(S.jg).map(function(k){return k+S.jg[k]}).join("");var raw="P2|"+rows.join("~")+"|"+jg+"|"+(S.best||0)+"|"+(S.talks||0);try{return btoa(raw)}catch(e){return raw}}
function uncode(str){var raw=String(str||"").trim();try{raw=atob(raw.replace(/\s+/g,""))}catch(e){}var p=raw.split("|");if(p[0]!=="P2")return false;var n=0;
(p[1]||"").split("~").forEach(function(r){var f=r.split(".");if(f.length!==3||!byId(f[0]))return;var last=parseInt(f[2],36)*36e5,cur=S.it[f[0]];if(!cur||!cur.seen||cur.last<last){S.it[f[0]]={b:Math.min(5,+f[1]||0),last:last,seen:1};n++}});
(p[2]||"").replace(/([a-z])(\d)/g,function(m,k,v){S.jg[k]=Math.max(S.jg[k]||0,+v)});S.best=Math.max(S.best||0,+p[3]||0);S.talks=Math.max(S.talks||0,+p[4]||0);save();return n+1}
function saveView(msg){stop();var app2=window.navigator.standalone||(window.matchMedia&&matchMedia("(display-mode: standalone)").matches);var n=ITEMS.filter(function(x){return seen(x.id)}).length;
show(back("home","главная")+'<div class="stack" style="gap:16px"><h2>Сохранение</h2>'+(msg?'<div class="warn">'+esc(msg)+"</div>":"")+'<p class="soft">Прогресс сохраняется сам после каждого ответа, сразу в два хранилища браузера. Сейчас в нём '+n+' фраз.</p><div class="list"><div><b>1. Добавь на экран «Домой»</b><span>'+(app2?"Уже сделано — ты сейчас в режиме приложения.":"Safari → кнопка «Поделиться» → «На экран Домой». Так сайт работает как приложение, и Safari не стирает его данные, пока ты им пользуешься.")+'</span></div><div><b>2. Код сохранения</b><span>Скопируй и положи в заметки. Вставишь на любом устройстве — прогресс вернётся.</span></div></div><textarea class="code" id="mycode" readonly>'+code()+'</textarea><div class="row"><button class="btn go" data-cmd="copy">Скопировать код</button><button class="btn" data-cmd="dl">Скачать файлом</button></div><div class="lab" style="margin-top:10px">вернуть прогресс</div><textarea class="code" id="incode" placeholder="вставь код сюда"></textarea><div class="row"><button class="btn" data-cmd="restore">Вернуть из кода</button><label class="btn thin" for="file">Открыть файл</label><input type="file" id="file" accept=".txt,text/plain" hidden></div><p class="dim" style="font-size:13.5px">При возврате ничего не теряется: из двух версий каждой фразы остаётся более свежая.</p></div>',"save");
var f=document.getElementById("file");if(f)f.addEventListener("change",function(){var fl=f.files&&f.files[0];if(!fl)return;var rd=new FileReader();rd.onload=function(){var r=uncode(rd.result);saveView(r?"Прогресс возвращён.":"Файл не подошёл.")};rd.readAsText(fl)})}
function about(){stop();var t="push yourself to the limit";show(back("home","главная")+'<div class="stack" style="gap:14px"><h2>Как это устроено</h2><div class="list"><div><b>Как фраза рассыпается</b><span class="noise">'+esc(t)+" → "+erode(t,.35,hash(t))+" → "+erode(t,.7,hash(t))+'</span><em>После верного ответа фраза снова чистая.</em></div>'+MODES.map(function(m){return"<div><b>"+m[0]+"</b><span>"+m[1]+"</span><em>"+m[2]+"</em></div>"}).join("")+'</div><div class="lab" style="margin-top:12px">думать по-английски</div><p class="soft">Внутренняя речь на втором языке растёт вместе с практикой вслух. Три привычки на день: проговаривай свои действия в Present Continuous («I\'m opening my laptop»); вечером перескажи день пятью фразами в прошедших временах; вместо «блин, забыла» — «I\'ve forgotten».</p><div class="lab" style="margin-top:12px">исследования</div><ol class="src">'+SRC.map(function(s){return'<li><a href="'+s[1]+'" target="_blank" rel="noopener">'+esc(s[0])+"</a></li>"}).join("")+"</ol></div>","about")}
function route(r){var p=r.split(":");if(p[0]==="home")home();else if(p[0]==="sec")section(p[1]);else if(p[0]==="learn")learn(p[1]);else if(p[0]==="learnx")learn(p[1],true);else if(p[0]==="talk"){if(p[1]!=null)talkOpen(+p[1]);else talks()}else if(p[0]==="save")saveView();else if(p[0]==="about")about()}
app.addEventListener("click",function(e){var b=e.target.closest("button,.kw,[data-hide],label");if(!b)return;
if(b.hasAttribute("data-hide")){b.textContent=b.getAttribute("data-hide");b.removeAttribute("data-hide");return}
if(b.classList.contains("kw")){if(b.classList.toggle("open"))b.textContent=b.getAttribute("data-kw");else b.innerHTML=erode(b.getAttribute("data-kw"),+b.getAttribute("data-e"),+b.getAttribute("data-s"));return}
var g=b.getAttribute("data-go");if(g){route(g);return}
if(b.hasAttribute("data-say")){say(b.getAttribute("data-say"));return}
if(b.id==="dial"){dial();return}
if(b.hasAttribute("data-cutk")){submit(b.getAttribute("data-cutk"));return}
if(b.hasAttribute("data-chip")){var k=b.getAttribute("data-chip");if(talk.used[k])delete talk.used[k];else talk.used[k]=1;b.classList.toggle("on");return}
var c=b.getAttribute("data-cmd"),w=b.getAttribute("data-w")||null;
if(c==="clean")start("clean");else if(c==="final")start("final");else if(c==="cold")start("cold",w);else if(c==="drill")start(w?"drill":"clean",w);
else if(c==="ok")submit();else if(c==="hint")hint();
else if(c==="jsay")say(JINGLES[w].join(" ").replace(/[\[\]]/g,""));
else if(c==="jup"){S.jg[w]=Math.min(3,(S.jg[w]||0)+1);save();learn(w);setTimeout(function(){var j=document.querySelector(".jing");if(j)j.scrollIntoView({block:"start"})},30)}
else if(c==="jreset"){S.jg[w]=0;save();learn(w)}
else if(c==="tgo")tgo();else if(c==="tsay")say(TALKS[talk.i].en);
else if(c==="copy"){var ta=document.getElementById("mycode");var done=function(){S.bk=Date.now();save();b.textContent="Скопировано"};try{navigator.clipboard.writeText(ta.value).then(done,function(){ta.select();done()})}catch(x){ta.select();done()}}
else if(c==="dl"){try{var bl=new Blob([code()],{type:"text/plain"}),a=document.createElement("a");a.href=URL.createObjectURL(bl);a.download="pomekhi-sport-"+new Date().toISOString().slice(0,10)+".txt";document.body.appendChild(a);a.click();a.remove();S.bk=Date.now();save()}catch(x){}}
else if(c==="restore"){var r=uncode(document.getElementById("incode").value);saveView(r?"Прогресс возвращён.":"Код не подошёл. Проверь, что скопирован целиком.")}});
boot();
</script></body></html>
